# nginx drops every inherited add_header the moment a nested location declares
# one of its own, so this snippet is included explicitly in each location that
# sets its own caching headers. Without it, /index.html — the response that
# actually matters — would ship with no CSP at all.
add_header X-Content-Type-Options  "nosniff"        always;
add_header X-Frame-Options         "SAMEORIGIN"     always;
add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
add_header Permissions-Policy      "geolocation=(self), camera=(), microphone=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.arcgis.com https://*.idaho.gov https://*.arcgisonline.com https://*.usda.gov https://*.blm.gov https://*.nationalmap.gov https://*.usgs.gov; worker-src 'self' blob:; frame-ancestors 'self'" always;
