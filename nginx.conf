server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/wasm image/svg+xml application/x-yaml text/yaml;

    # --- runtime config --------------------------------------------------
    # Never cached: editing the mounted YAML takes effect on the next reload.
    location = /config/app.config.yml {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, must-revalidate" always;
        default_type "application/yaml; charset=utf-8";
    }

    # --- fingerprinted build assets ---------------------------------------
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # ArcGIS SDK assets are versioned with the package, safe to cache hard.
    location /esri/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # index.html must always revalidate so a new deploy is picked up.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
