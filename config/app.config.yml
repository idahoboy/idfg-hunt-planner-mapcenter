# =============================================================================
#  IDFG Hunt Planner — Map Center  ::  runtime configuration
# =============================================================================
#  This file is READ AT RUNTIME by the browser (fetched from /config/app.config.yml).
#  Editing it and reloading the page changes the app — no rebuild, no redeploy.
#  In Docker it is bind-mounted, so `docker compose restart` is not even needed.
#
#  Validate before shipping:   npm run config:validate
#  Validate + probe every URL: npm run config:health
#
#  Schema is enforced by zod at boot (src/config/schema.ts). A layer that fails
#  validation is skipped with a console warning rather than taking down the map.
# =============================================================================

version: 5

app:
  title: Idaho Hunt Planner
  subtitle: Map Center
  logo: /branding/idfg-logo.svg
  helpUrl: https://idfg.idaho.gov/ifwis/huntplanner/mapcenter/HelpDocV2/IDFG%20Hunt%20Planner%20Map%20Center%20Help%20Documentation.html
  contactUrl: https://idfg.idaho.gov/ifwis/portal/contact#huntplanner
  rulesUrl: https://idfg.idaho.gov/public/hunt/rules/
  termsUrl: https://idfg.idaho.gov/public/about/terms/
  huntPlannerUrl: https://idfg.idaho.gov/ifwis/huntplanner/

# -----------------------------------------------------------------------------
# Service roots. Reference these anywhere below with ${roots.<name>}.
# -----------------------------------------------------------------------------
roots:
  idfgPortal: https://gisportal-idfg.idaho.gov/portal
  idfgRest: https://gisportal-idfg.idaho.gov/hosting/rest/services
  idfgAgol: https://services.arcgis.com/FjJI5xHF2dUPVrgK/ArcGIS/rest/services
  esriBase: https://services.arcgisonline.com/ArcGIS/rest/services
  usgsBase: https://basemap.nationalmap.gov/arcgis/rest/services
  nifc: https://services3.arcgis.com/T4QMspbfLg3qTGWY/arcgis/rest/services
  esriLive: https://services9.arcgis.com/RHVPKKiFTONKtxq3/ArcGIS/rest/services
  idpr: https://services1.arcgis.com/CNPdEkvnGl65jCX8/ArcGIS/rest/services
  usfs: https://apps.fs.usda.gov/arcx/rest/services
  blm: https://gis.blm.gov/arcgis/rest/services
  idaho: https://gis2.idaho.gov/arcgis/rest/services
  idl: https://services2.arcgis.com/1cvrwLhZRFh3okEF/ArcGIS/rest/services

# CORS-enabled servers. 4.x needs no proxy for any of these; the legacy
# gis_proxy.ashx is gone. Listed for esriConfig.request.trustedServers.
network:
  # IMPORTANT: only list servers that require CREDENTIALS (cookies / IWA).
  # Listing a public service here makes the SDK send `credentials: include`,
  # and the browser then rejects the response because those services answer
  # `Access-Control-Allow-Origin: *`. Every service this app uses is public
  # and CORS-enabled, so this list is intentionally empty.
  trustedServers: []
  # Optional: only used if a service ever loses CORS. Leave null to disable.
  proxyUrl: null
  requestTimeoutMs: 30000

map:
  center: [-114.52, 45.50]
  zoom: 6
  minZoom: 4
  maxZoom: 20
  # Idaho + margin. Constrains the view and bounds the geocoder.
  extent:
    xmin: -119.925
    ymin: 40.439
    xmax: -109.137
    ymax: 50.199
    wkid: 4326
  popup:
    dockEnabled: true
    dockPosition: bottom-right
    breakpoint: true

# -----------------------------------------------------------------------------
# Basemaps — all keyless. No ArcGIS Location Platform API key required,
# no credit consumption. `default` must match one of the ids below.
# -----------------------------------------------------------------------------
basemaps:
  default: esri-topo
  items:
    - id: esri-topo
      title: Esri World Topographic
      type: tiled
      url: ${roots.esriBase}/World_Topo_Map/MapServer
      thumbnail: /thumbnails/world_topo.png
      printable: true
    - id: esri-imagery
      title: Esri Satellite Imagery
      type: tiled
      url: ${roots.esriBase}/World_Imagery/MapServer
      thumbnail: /thumbnails/world_imagery.png
      printable: true
    - id: esri-imagery-labels
      title: Esri Imagery with Labels
      type: tiled
      url: ${roots.esriBase}/World_Imagery/MapServer
      referenceUrl: ${roots.esriBase}/Reference/World_Boundaries_and_Places/MapServer
      thumbnail: /thumbnails/imageryLabels.jpg
      printable: true
    - id: usa-topo
      title: Esri USGS Topographic
      type: tiled
      url: ${roots.esriBase}/USA_Topo_Maps/MapServer
      thumbnail: /thumbnails/usa_topo.jpg
      printable: true
    - id: usgs-topo
      title: USGS National Map
      type: tiled
      url: ${roots.usgsBase}/USGSTopo/MapServer
      thumbnail: /thumbnails/usgstopo.jpg
      printable: true
    # NEW — not in the legacy app. USGS imagery+topo hybrid, keyless.
    - id: usgs-imagery-topo
      title: USGS Imagery Topo
      type: tiled
      url: ${roots.usgsBase}/USGSImageryTopo/MapServer
      thumbnail: /thumbnails/usgstopo.jpg
      printable: true
    - id: hillshade-topo
      title: Hillshade + Topographic
      type: tiled
      url: ${roots.esriBase}/Elevation/World_Hillshade/MapServer
      referenceUrl: ${roots.esriBase}/World_Topo_Map/MapServer
      thumbnail: /thumbnails/topoHigh.jpg
      printable: true

# -----------------------------------------------------------------------------
# Layer groups — these become the four accordion sections in the Layers panel
# AND the four legacy URL-parameter namespaces (?hunt=&admin=&reference=&wildlife=).
# -----------------------------------------------------------------------------
groups:
  - id: hunt
    title: Hunt Related Layers
    urlParam: hunt
    icon: crosshair
    defaultOpen: true
  - id: admin
    title: Administrative Boundaries
    urlParam: admin
    icon: boundary
  - id: reference
    title: Access, Roads & Land Management
    urlParam: reference
    icon: road
  - id: wildlife
    title: Fire, Closures & Advisories
    urlParam: wildlife
    icon: flame

# -----------------------------------------------------------------------------
# LAYERS
# -----------------------------------------------------------------------------
#  legacyBit  preserves the old bitmask deep links (?hunt=5 -> bits 1 and 4).
#             Every existing shared/bookmarked URL keeps working.
#  health     verified   = probed live 2026-08 and returned 200 + schema
#             replaced   = legacy endpoint was dead; this is the new source
#             unverified = could not be reached from the build network
#  scaleGate  reproduces the legacy "(zoom in to activate)" behaviour, but the
#             threshold now lives here instead of four pairs of jQuery functions.
# -----------------------------------------------------------------------------
layers:

  # ======================= HUNT =======================
  - id: game-management-units
    title: Game Management Units
    group: hunt
    legacyBit: 1
    type: feature
    url: ${roots.idfgAgol}/GameManagementUnits/FeatureServer/0
    visible: true
    health: verified
    outFields: [OBJECTID, NAME, ID, Elk_Zone, regular_deer_url, elkZone_url_1, gmu_wtd_url]
    popup:
      title: "Game Management Unit {NAME}"
      fields:
        - { label: Unit, field: NAME }
        - { label: Elk Zone, field: Elk_Zone }
      links:
        - { label: Deer seasons for this unit, field: regular_deer_url }
        - { label: Elk zone seasons, field: elkZone_url_1 }
        - { label: White-tailed deer info, field: gmu_wtd_url }
    labels:
      field: NAME
      minScale: 3000000
      color: "#1f2d16"
      haloColor: "#ffffff"
      size: 11
      weight: bold

  - id: gmu-motorized-rules
    title: GMUs with Motorized Hunting Rules
    group: hunt
    legacyBit: 2
    type: feature
    url: ${roots.idfgAgol}/GMUsWithMotorizedHuntingRules/FeatureServer/0
    health: verified
    outFields: [OBJECTID, NAME]
    popup:
      title: "Motorized Hunting Rule — Unit {NAME}"
      content: >
        This unit has motorized hunting rule restrictions. Consult the current
        big game seasons and rules booklet before hunting.
    disclaimer:
      text: Motorized hunting rules restrict the use of motorized vehicles while hunting. Rules vary by unit and season.
      url: https://idfg.idaho.gov/public/hunt/rules/

  - id: cwd-management-zone
    title: Chronic Wasting Disease Management Zone
    group: hunt
    legacyBit: 131072
    type: feature
    url: ${roots.idfgRest}/Hunting/MapServer/0
    definitionExpression: "ID IN (2707,2802,2803)"
    health: verified
    outFields: ["*"]
    popup:
      title: CWD Management Zone
      fields:
        - { label: Area, field: NAME }
      content: >
        Mandatory CWD sampling may apply in this zone. Carcass transport
        restrictions are in effect.
      links:
        - { label: CWD rules and sampling, url: "https://idfg.idaho.gov/conservation/wildlife-health/cwd" }

  - id: elk-management-zones
    title: Elk Management Zones
    group: hunt
    legacyBit: 4
    type: feature
    url: ${roots.idfgAgol}/ElkManagementZones/FeatureServer/0
    health: verified
    outFields: [OBJECTID, NAME, ID]
    popup:
      title: "{NAME} Elk Zone"
      fields:
        - { label: Zone, field: NAME }
    labels:
      field: NAME
      minScale: 3000000
      color: "#5a2d0c"
      haloColor: "#ffffff"
      size: 11
      weight: bold

  # ---- Controlled hunt areas -------------------------------------------------
  # All eight are one service filtered by BigGame.
  #
  # NOTE: do NOT add a `Year` clause here. The legacy source pinned
  # "Year = 2020", but Year on this service is not a hunt season and filtering
  # on it drops valid areas. The service stores multiple rows per hunt area, so
  # these layers draw each polygon more than once; that is cosmetic (identical
  # geometry stacked) and preferable to filtering on a field whose meaning is
  # not what its name suggests. The Hunt Finder collapses the duplicates with
  # `dedupeBy` (see huntFinder.sources.controlled-hunts).
  - id: controlled-hunt-antelope
    title: Controlled Hunt Areas — Antelope
    group: hunt
    legacyBit: 8
    type: feature
    url: ${roots.idfgAgol}/ControlledHunts_All/FeatureServer/0
    definitionExpression: "BigGame = 'Pronghorn'"
    health: verified
    outFields: [BigGame, HuntArea, Area, BigGameRank]
    popup: &chPopup
      title: "{BigGame} Controlled Hunt Area {HuntArea}"
      fields:
        - { label: Hunt Area, field: HuntArea }
        - { label: Area Note, field: Area }

  - id: controlled-hunt-bear
    title: Controlled Hunt Areas — Black Bear
    group: hunt
    legacyBit: 16
    type: feature
    url: ${roots.idfgAgol}/ControlledHunts_All/FeatureServer/0
    definitionExpression: "BigGame = 'Bear'"
    health: verified
    outFields: [BigGame, HuntArea, Area, BigGameRank]
    popup: *chPopup

  - id: controlled-hunt-bighorn
    title: Controlled Hunt Areas — Bighorn Sheep
    group: hunt
    legacyBit: 32
    type: feature
    url: ${roots.idfgAgol}/ControlledHunts_All/FeatureServer/0
    definitionExpression: "BigGame LIKE '%Sheep'"
    health: verified
    outFields: [BigGame, HuntArea, Area, BigGameRank]
    popup: *chPopup

  - id: controlled-hunt-deer
    title: Controlled Hunt Areas — Deer
    group: hunt
    legacyBit: 64
    type: feature
    url: ${roots.idfgAgol}/ControlledHunts_All/FeatureServer/0
    definitionExpression: "BigGame = 'Deer'"
    health: verified
    outFields: [BigGame, HuntArea, Area, BigGameRank]
    popup: *chPopup

  - id: controlled-hunt-elk
    title: Controlled Hunt Areas — Elk
    group: hunt
    legacyBit: 128
    type: feature
    url: ${roots.idfgAgol}/ControlledHunts_All/FeatureServer/0
    definitionExpression: "BigGame = 'Elk'"
    health: verified
    outFields: [BigGame, HuntArea, Area, BigGameRank]
    popup: *chPopup

  - id: controlled-hunt-goat
    title: Controlled Hunt Areas — Mountain Goat
    group: hunt
    legacyBit: 256
    type: feature
    url: ${roots.idfgAgol}/ControlledHunts_All/FeatureServer/0
    definitionExpression: "BigGame = 'Goat'"
    health: verified
    outFields: [BigGame, HuntArea, Area, BigGameRank]
    popup: *chPopup

  - id: controlled-hunt-moose
    title: Controlled Hunt Areas — Moose
    group: hunt
    legacyBit: 512
    type: feature
    url: ${roots.idfgAgol}/ControlledHunts_All/FeatureServer/0
    definitionExpression: "BigGame = 'Moose'"
    health: verified
    outFields: [BigGame, HuntArea, Area, BigGameRank]
    popup: *chPopup

  - id: controlled-hunt-turkey
    title: Controlled Hunt Areas — Turkey
    group: hunt
    legacyBit: 1024
    type: feature
    url: ${roots.idfgAgol}/ControlledHunts_All/FeatureServer/0
    definitionExpression: "BigGame = 'Turkey'"
    health: verified
    outFields: [BigGame, HuntArea, Area, BigGameRank]
    popup: *chPopup

  # ---- Hunting restrictions --------------------------------------------------
  - id: restrictions-big-game
    title: Areas with Hunting Restrictions — Big Game
    group: hunt
    legacyBit: 2048
    type: feature
    url: ${roots.idfgAgol}/AreasWithHuntingRestrictions/FeatureServer/0
