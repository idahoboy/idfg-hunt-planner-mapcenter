  - id: pheasant-stocking
    title: Pheasant Stocking Areas
    group: hunt
    legacyBit: 262144
    type: feature
    url: ${roots.idfgAgol}/Pheasant_Stocking/FeatureServer/0
    health: verified
    outFields: ["*"]
    popup:
      title: "{Name}"
      fields:
        - { label: Area, field: Name }
      links:
        - { label: Stocking schedule, field: Link }

  - id: wolf-management-zones
    title: Wolf Management Zones
    group: hunt
    legacyBit: 524288
    type: feature
    url: ${roots.idfgAgol}/Wolf_Management_Zones/FeatureServer/0
    health: verified
    outFields: ["*"]
    popup:
      title: "Wolf Management Zone {DAU}"
      fields:
        - { label: Zone, field: DAU }

  # ======================= ADMINISTRATIVE =======================
  - id: fish-game-regions
    title: Fish and Game Regions
    group: admin
    legacyBit: 1
    type: feature
    url: ${roots.idfgAgol}/Administrative_Regions/FeatureServer/0
    health: verified
    outFields: ["*"]
    popup:
      title: "{NAME} Region"
      fields:
        - { label: Region, field: NAME }
    labels: { field: NAME, minScale: 5000000, color: "#004b23", haloColor: "#ffffff", size: 12, weight: bold }

  - id: counties
    title: Counties
    group: admin
    legacyBit: 2
    type: feature
    # REPLACED: legacy pointed at gis2.idaho.gov/IdahoAGOL/Idaho_Counties, which
    # did not respond during the 2026-08 audit. This IDFG-hosted layer carries
    # the same boundaries and is under IDFG's own control.
    url: ${roots.idfgAgol}/IdahoConservationPlannerAdministrativeBoundaries/FeatureServer/1
    fallbackUrl: ${roots.idaho}/IdahoAGOL/Idaho_Counties/MapServer/1
    health: replaced
    outFields: ["*"]
    popup:
      title: "{NAME} County"
    labels: { field: NAME, minScale: 2500000, color: "#000000", haloColor: "#ffffff", size: 10, weight: bold }

  - id: usgs-quads
    title: USGS Quad Map Boundaries
    group: admin
    legacyBit: 4
    type: feature
    url: https://services.arcgis.com/WLhB60Nqwp4NnHz3/ArcGIS/rest/services/usgs_quads_7pt5minute_id/FeatureServer/0
    health: verified
    outFields: ["*"]
    popup:
      title: "{NAME} Quadrangle"
      fields:
        - { label: Quad name, field: NAME }
    labels: { field: NAME, minScale: 750000, color: "#333333", haloColor: "#ffffff", size: 9 }

  - id: blm-field-offices
    title: BLM Field Office Boundaries
    group: admin
    legacyBit: 8
    type: feature
    url: ${roots.blm}/admin_boundaries/BLM_Natl_AdminUnit/MapServer/3
    definitionExpression: "ADMIN_ST = 'ID'"
    health: verified
    outFields: ["*"]
    popup:
      title: "{ADMU_NAME}"
      fields:
        - { label: Office, field: ADMU_NAME }
        - { label: District, field: PARENT_NAME }
      links:
        - { label: Field office website, field: ADMU_ST_URL }
    renderer:
      type: simple
      symbol: { type: line, color: "#8400a8", width: 2, style: long-dash-dot }
    labels: { field: ADMU_NAME, minScale: 2500000, color: "#8400a8", haloColor: "#ffffff", size: 9, weight: bold }

  - id: usfs-admin
    title: USFS Administrative Boundaries
    group: admin
    legacyBit: 16
    type: feature
    url: ${roots.idfgAgol}/IdahoConservationPlannerAdministrativeBoundaries/FeatureServer/5
    definitionExpression: >
      FORESTNAME IN ('Idaho Panhandle National Forests','Kootenai National Forest',
      'Nez Perce-Clearwater National Forest','Bitterroot National Forest',
      'Payette National Forest','Salmon-Challis National Forest','Boise National Forest',
      'Sawtooth National Forest','Caribou-Targhee National Forest','Wallowa-Whitman National Forest')
    health: verified
    opacity: 0.5
    outFields: ["*"]
    popup:
      title: "{FORESTNAME}"
      fields:
        - { label: Forest, field: FORESTNAME }
        - { label: Region, field: REGION }
        - { label: Acres, field: GIS_ACRES, format: number }
    renderer:
      type: simple
      symbol:
        type: fill
        color: "#e9ffbe"
        outline: { color: "#267300", width: 2 }
    labels: { field: FORESTNAME, minScale: 2500000, color: "#267300", haloColor: "#e9ffbe", size: 10, weight: bold }

  - id: usfs-ranger-districts
