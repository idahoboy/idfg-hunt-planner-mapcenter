  - id: sage-grouse-zones
    title: Sage Grouse Zones
    group: hunt
    legacyBit: 65536
    type: feature
    url: ${roots.idfgAgol}/Sage_Grouse_Zones/FeatureServer/0
    health: verified
    outFields: ["*"]
    popup:
      title: "Sage-grouse Zone {RepoZone}"
      fields:
        - { label: Zone, field: RepoZone }
