# =============================================================================
#  HUNT FINDER  —  the VRBO-style top filter bar + results rail
# =============================================================================
#  Every facet below is answered by a live ArcGIS attribute query. Nothing is
#  hard-coded: pick-list values are read from the services at boot and cached
#  for `cacheTtlMinutes`. Adding a facet here adds a control to the filter bar.
#
#  `sources` are the searchable record sets. A source is included in a search
#  only when the active facet values can be expressed against its fields, so
#  selecting "Elk" narrows Controlled Hunts and Elk Zones but drops Waterfowl.
# =============================================================================
huntFinder:
  enabled: true
  pageSize: 50

  # The finder reads the snapshot, not the map services.
  #
  # The five axes below all describe the hunt itself and are genuinely
  # parallel. The old toggle mixed geography (units, elk zones), hunt class
  # (controlled) and programme (Access Yes!) in one control, which asked the
  # reader to choose between a noun and a place. Geography is now its own
  # dimension and access programmes live in the click result, where they
  # already were.
  #
  # None of these exist on the map services — method, ornament, season and tag
  # are inventory attributes — so the finder had to move to the snapshot for
  # them to be offered at all.
  inventory:
    url: /inventory.json

  results:
    hoverHighlights: true
    clickZooms: true
    syncToExtent: true
    syncDefault: false
    emptyMessage: No hunts match these filters. Try clearing one.
    caveat: >
      Some hunt areas are stored with more than one boundary version and the
      current one is not yet confirmed. Check the boundary against the printed
      seasons and rules before relying on it.

  facets:
    - id: species
      label: Species
      field: species
      type: multiselect
      icon: deer
      placeholder: Any species
      primary: true
      sortBy: label

    - id: huntClass
      label: Hunt type
      field: type
      type: toggleGroup
      icon: tag
      primary: true
      options:
        - { value: general, label: General season }
        - { value: controlled, label: Controlled hunt }

    # Sharper than weapon and currently offered nowhere: it splits the
    # inventory almost in thirds.
    - id: ornament
      label: Sex / antler
      field: ornament
      type: multiselect
      icon: deer
      placeholder: Any restriction
      primary: true
      sortBy: label

    # When someone can actually go is the first question of a trip, and it is
    # the axis the whole reframe was built around. Matching is by month
    # rather than an exact range: a hunt counts if its season touches the
    # month at all, which is the question people ask out loud.
    - id: month
      label: When
      field: months
      multiValue: true
      type: multiselect
      icon: calendar
      placeholder: Any month
      primary: true
      sortBy: value
      labels:
        "1": January
        "2": February
        "3": March
        "4": April
        "5": May
        "6": June
        "7": July
        "8": August
        "9": September
        "10": October
        "11": November
        "12": December

    - id: unit
      label: Unit
      field: unitsReferenced
      multiValue: true
      type: multiselect
      icon: hash
      placeholder: Any unit
      primary: true
      sortBy: natural

    # 614 of 1,052 hunts are "Any Weapon", so this filters little until someone
    # picks archery — which is why it is not a primary facet.
    - id: weapon
      label: Weapon
      field: method
      type: multiselect
      icon: crosshair
      placeholder: Any weapon
      sortBy: label

    - id: tagType
      label: Tag
      field: tagArea
      type: multiselect
      icon: tag
      placeholder: Any tag
      sortBy: label

    - id: season
      label: Season
      field: season
      type: multiselect
      icon: calendar
      placeholder: Any season
      sortBy: label

    - id: access
      label: Access
      field: accessGrade
      type: multiselect
      icon: check
      placeholder: Any access
      labels:
        open: Open access
        limited: Limited access
        permission: Permission required
        rule: Special rule

    - id: keyword
      label: Search
      type: search
      icon: search
      primary: true
      placeholder: Tag, hunt number, unit or area
      searchFields: [tag, area, season, tagArea]

# =============================================================================
#  HIGHLIGHT  —  the legacy "Highlight a Hunt Area" tool
# =============================================================================
#  Kept for URL compatibility. Legacy deep links look like:
#     ?val=1234&lyr=4&lbl=Sawtooth+Elk+Zone
#  `queryLayers` is indexed by the legacy `lyr` value, so old links from the
#  Hunt Planner search results keep resolving.
# =============================================================================
highlight:
  # Pick lists for the legacy "Highlight a Hunt Area" tool. These used to ride
  # on huntFinder.sources; the finder now reads the snapshot, so they live with
  # the tool that actually uses them.
  pickLists:
    - id: game-units
      title: Game Management Units
      url: "${roots.idfgRest}/Hunting/MapServer/3"
      idField: ID
      labelField: NAME
      sortBy: natural
      outFields: [ID, NAME, Name_sort]
      orderBy: [Name_sort]
      titleTemplate: "Unit {NAME}"
      kmlTemplate: "${roots.idfgRest}/Hunting/MapServer/3/query?where=ID+IN+({ids})&outFields=NAME&returnGeometry=true&outSR=4326&f=kmz"
    - id: elk-zones
      title: Elk Management Zones
      url: "${roots.idfgRest}/Hunting/MapServer/1"
      idField: ID
      labelField: NAME
      outFields: [ID, NAME]
      orderBy: [NAME]
      titleTemplate: "{NAME} Elk Zone"
      kmlTemplate: "${roots.idfgRest}/Hunting/MapServer/1/query?where=ID+IN+({ids})&outFields=NAME&returnGeometry=true&outSR=4326&f=kmz"
    - id: controlled-hunts
      title: Controlled Hunt Areas
      url: "${roots.idfgRest}/Hunting/MapServer/4"
      idField: AreaID
      labelField: HuntArea
      sortBy: natural
      outFields: [AreaID, HuntArea, BigGame, AreaRank]
      orderBy: [AreaRank, HuntArea]
      titleTemplate: "{BigGame} Hunt Area {HuntArea}"
      kmlTemplate: "${roots.idfgRest}/Hunting/MapServer/4/query?where=AreaID+IN+({ids})&outFields=*&returnGeometry=true&outSR=4326&f=kmz"
    - id: waterfowl-areas
      title: Waterfowl Hunt Areas
      url: "${roots.idfgAgol}/WaterfowlHuntAreas/FeatureServer/0"
      idField: huntID
      labelField: Area_Name
      outFields: [huntID, Area_Name]
      orderBy: [Area_Name]
      titleTemplate: "{Area_Name}"
      kmlTemplate: "${roots.idfgAgol}/WaterfowlHuntAreas/FeatureServer/0/query?where=huntID+IN+({ids})&outFields=*&returnGeometry=true&outSR=4326&f=kmz"

  symbol:
    fill: "rgba(154, 32, 219, 0.10)"
    outline: "#9a20db"
    width: 2
  hatchedSymbol:
    style: backward-diagonal
    color: "#9a20db"
    width: 3
  labelSymbol:
    color: "#3c0a5e"
    haloColor: "#ffffff"
    size: 13
    weight: bold
  zoomPadding: 60
  # index == legacy `lyr` URL parameter value
  queryLayers:
    0: { url: "${roots.idfgRest}/Hunting/MapServer/0", idField: ID,      label: Hunt Areas }
    1: { url: "${roots.idfgRest}/OutfittersAndGuides/MapServer/0", idField: ID, label: Outfitter & Guide Areas }
    2: { url: "${roots.idfgRest}/Hosted/Access_Yes_2026_public/FeatureServer/0", idField: id, label: "Access Yes! Properties" }
    3: { url: "${roots.idfgRest}/Hunting/MapServer/3", idField: ID,      label: Game Management Units }
    4: { url: "${roots.idfgRest}/Hunting/MapServer/1", idField: ID,      label: Elk Zones }
    5: { url: "${roots.idfgRest}/Hunting/MapServer/4", idField: AreaID,  label: Controlled Hunts }
    6: { url: "${roots.idfgAgol}/WaterfowlHuntAreas/FeatureServer/0", idField: huntID, label: Waterfowl Hunt Areas }
    7: { url: "${roots.idfgRest}/Species/Distribution/MapServer/3", idField: TaxonID, label: Species Distribution }

# =============================================================================
#  CLICK QUERY  —  what happens when someone clicks the map
# =============================================================================
#  A click is a location question, not a feature lookup. The default SDK popup
#  answers "what is this polygon" and paginates when layers overlap; this
#  answers "what can I hunt here, and can I get on it".
# =============================================================================
clickQuery:
  enabled: true
  # Click tolerance in screen pixels, so a fingertip on a phone still resolves.
  tolerancePx: 8

  # Zoom decides how precise an answer is honest. Naming a unit is defensible
  # statewide; naming the parcel under the cursor is not.
  granularity:
    localBelowScale: 200000
    regionalBelowScale: 3000000

  # Context layers answer "where am I". Each is a point-intersect query.
  context:
    - { id: unit,     label: Unit,      url: "${roots.idfgRest}/Hunting/MapServer/3", fields: [NAME, Elk_Zone], display: NAME }
    - { id: elkZone,  label: Elk zone,  url: "${roots.idfgRest}/Hunting/MapServer/1", fields: [NAME], display: NAME }
    - { id: region,   label: Region,    url: "${roots.idfgAgol}/Administrative_Regions/FeatureServer/0", fields: [NAME], display: NAME }
    - { id: huntArea, label: Hunt area, url: "${roots.idfgRest}/Hunting/MapServer/4", fields: [AreaID, BigGame, HuntArea], display: HuntArea, multiple: true }

  # Land ownership under the cursor.
  #
  # IMPORTANT — this is BLM's *national, generalized* Surface Management Agency
  # layer. It is a good regional picture and it is NOT a title record: parcel
  # edges are approximate, it lags real transactions, and it knows nothing
  # about access agreements. The UI must attribute it and hedge it rather than
  # state ownership as fact. See `agreements` below, which corrects the most
  # damaging case.
  ownership:
    url: "https://gis.blm.gov/arcgis/rest/services/lands/BLM_Natl_SMA_Cached_without_PriUnk/MapServer/1"
    fields: [ADMIN_AGENCY_CODE, ADMIN_UNIT_NAME, ADMIN_DEPT_CODE]
    agencyField: ADMIN_AGENCY_CODE
    nameField: ADMIN_UNIT_NAME
    source: BLM Surface Management Agency (national, generalized)
    caveat: >
      Generalized regional data, not a title record or a survey. Boundaries are
      approximate and it does not reflect access agreements. Verify before you hunt.
    # BLM's codes are terse; these are what a person would say.
    labels:
      PVT: Private land
      BLM: BLM
      FS: US Forest Service
      NPS: National Park Service
      FWS: US Fish and Wildlife Service
      STL: State of Idaho
      STP: State park
      DOD: Department of Defense
      BOR: Bureau of Reclamation
      TRIB: Tribal land
      OTHF: Other federal

  # ---------------------------------------------------------------------
  # ACCESS
  #
  # Every access programme IDFG or its partners maintain, queried together
  # both AT the clicked point and WITHIN `proximityMeters` of it, because
  # "there is walk-in access a quarter mile from here" is often more useful
  # than anything true of the pixel under the cursor.
  #
  # These OVERRIDE a bare ownership reading. An Access Yes! property is
  # private land IDFG has already secured public access on; reporting it as
  # "private, permission required" is wrong and hides the most useful thing
  # on the map.
  #
  # None of it is authoritative. See `caveat` — the UI states it every time.
  # ---------------------------------------------------------------------
  access:
    caveat: >
      Access information is assembled from the best available data and is a
      guide, not a guarantee. Boundaries are approximate, agreements change
      during the season, and postings on the ground take precedence over
      anything shown here. Check signs and current rules before you hunt.
    proximityMeters: 8000
    sources:
      - id: access-yes
        label: Access Yes!
        url: "${roots.idfgRest}/Hosted/Access_Yes_2026_public/FeatureServer/0"
        where: "bidid IS NOT NULL"
        fields: [name, generalarea, biggame, uplandgame, waterfowl, fishing, landnotify, accessbegin, accessend, contactname]
        nameField: name
        notifyField: landnotify
      - id: endowment-lands
        label: Endowment land
        url: "${roots.idl}/IDL_Public_Access/FeatureServer/0"
        fields: ["*"]
        nameField: Access
      - id: large-tracts-0
        label: Large tract agreement
        url: "${roots.idfgRest}/Access/Large_Tracts_Access_Agreements/MapServer/0"
        fields: ["*"]
        nameField: Name
      - id: large-tracts-1
        label: Large tract agreement
        url: "${roots.idfgRest}/Access/Large_Tracts_Access_Agreements/MapServer/1"
        fields: ["*"]
        nameField: Name
      - id: forest-legacy
        label: Forest Legacy
        url: "${roots.idfgRest}/Access/Access/MapServer/4"
        fields: ["*"]
        nameField: Name
      - id: other-access
        label: Other access programme
        url: "${roots.idfgRest}/Access/Access/MapServer/5"
        fields: ["*"]
        nameField: Name
      - id: wma
        label: Wildlife Management Area
        url: "${roots.idfgAgol}/WildlifeManagementAreas/FeatureServer/0"
        fields: ["*"]
        nameField: Name

  # Two link patterns on the existing Hunt Planner, both verified live. They
  # are NOT the same thing, and labelling them as if they were would mislead:
  #
  #   /hunt/{id}     the opportunity — this tag in THIS area.
  #                  78277 -> "Hunt Area 76-1X Elk Controlled Hunt 2256"
  #   /tag/{tagId}   the tag across every area it is valid in.
  #                  31234 -> "Elk Controlled Hunt 2256"
  #
  # A bogus id returns a page titled "Hunt not found" rather than a 404, so a
  # link checker has to read the title, not the status code.
  huntDetailUrl: "https://idfg.idaho.gov/ifwis/huntplanner/hunt/{id}"
  tagDetailUrl: "https://idfg.idaho.gov/ifwis/huntplanner/tag/{tagId}"
  rulesUrl: "https://idfg.idaho.gov/rules"

  # Hunts are matched from the snapshot, not the network.
  inventory:
    url: /inventory.json
    # A general hunt references units in prose; a controlled hunt resolves by
    # AreaID. Both paths are needed — see docs/BRAINSTORM-2026-08.md.
    matchGeneralByUnit: true
    matchControlledByAreaId: true
    maxHunts: 40

# =============================================================================
#  TOOLS
# =============================================================================
tools:
  layers:      { enabled: true, label: Turn Layers On/Off, icon: layers }
  basemap:     { enabled: true, label: Change the Basemap, icon: globe }
  highlight:   { enabled: true, label: Highlight a Hunt Area, icon: bolt }
  huntFinder:  { enabled: true, label: Find a Hunt, icon: search }

  upload:
    enabled: true
    label: Upload Waypoints & Tracks
    icon: upload
    # Legacy accepted GPX only, via the ArcGIS Online generate endpoint (an
    # external round-trip that uploaded the user's file to arcgis.com).
    # These formats are parsed entirely in the browser — nothing leaves the
    # device — which is both faster and better for privacy.
    formats: [gpx, kml, kmz, geojson, csv]
    maxFileSizeMb: 25
    maxFeatures: 20000
    symbols:
      point:   { color: "#ff0000", size: 9, outline: "#000000" }
      line:    { color: "#ff0000", width: 3 }
      polygon: { color: "rgba(255,0,0,0.25)", outline: "#ff0000" }

  search:
    enabled: true
    label: Search By Place or Coordinates
    icon: search
    # Keyless Esri World Geocoder. Suggestions + geocoding both work without a
    # key for this service; results are clipped to the Idaho extent.
    geocoder:
      url: https://geocode-api.arcgis.com/arcgis/rest/services/World/GeocodeServer
      fallbackUrl: https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer
      countryCode: USA
      maxSuggestions: 8
    coordinateFormats: [dd, dms, ddm, utm, mgrs]
    defaultCoordinateFormat: dd
    zoomScale: 36112

  measure:
    enabled: true
    label: Measurements & Coordinates
    icon: ruler
    lengthUnits: [miles, feet, kilometers, meters, yards, nautical-miles]
    areaUnits: [acres, square-miles, hectares, square-kilometers, square-feet]
    defaultLengthUnit: miles
    defaultAreaUnit: acres
    symbol:
      color: "rgba(165, 24, 221, 0.55)"
      width: 3

  draw:
    enabled: true
    label: Draw On the Map
    icon: pencil
    tools: [point, multipoint, polyline, polygon, rectangle, circle, freehand-polyline, freehand-polygon, text]
    defaultColor: "#ff7200"
    palette: ["#ff7200", "#e11d48", "#2563eb", "#16a34a", "#7c3aed", "#000000", "#ffffff"]
    textDefaults:
      size: 14
      color: "#000000"
      haloColor: "#ffffff"
      weight: bold
    # NEW: drawings survive a reload (legacy lost them on refresh).
    persistToLocalStorage: true

  print:
    enabled: true
    label: Create Printable Map
    icon: printer
    serviceUrl: ${roots.idfgRest}/Utilities/PrintingTools/GPServer/Export%20Web%20Map%20Task
    layouts:
      - { value: "Letter ANSI A Portrait",  label: "Letter — Portrait" }
      - { value: "Letter ANSI A Landscape", label: "Letter — Landscape" }
      - { value: "Tabloid ANSI B Portrait", label: "Tabloid — Portrait" }
      - { value: "Tabloid ANSI B Landscape",label: "Tabloid — Landscape" }
      - { value: "MAP_ONLY",                label: "Map only (no margins)" }
    formats: [PDF, PNG32, PNG8, JPG, GIF, EPS, SVG]
    defaultLayout: Letter ANSI A Landscape
    defaultFormat: PDF
    dpi: 150
    includeLegend: true
    timeoutSeconds: 120

  share:
    enabled: true
    label: Share This Map
    icon: link
    # NEW — the legacy app could only be deep-linked from outside; it never
    # produced a link to the user's own current view.
    includesLayerState: true
    includesFilters: true
    includesExtent: true
    includesDrawings: false
    shortLinkService: null

  kml:
    enabled: true
    label: Download Highlighted Areas as KML
    icon: download

  export:
    enabled: true
    label: Download results as CSV
    icon: table
    maxRows: 5000

  locate:
    enabled: true
    label: My Location
    icon: crosshair
    scale: 36112

  coordinateReadout:
    enabled: true
    # Click the readout to cycle through these.
    formats: [dd, dms, utm]
    utmZones:
      - { wkid: 102205, label: "NAD83 UTM 11T", minLon: -120, maxLon: -114 }
      - { wkid: 102206, label: "NAD83 UTM 12T", minLon: -114, maxLon: -108 }

# =============================================================================
#  UI
# =============================================================================
ui:
  theme:
    # Palette taken from the IDFG Technical Services Bureau Prospectus (2024):
    # deep navy blocks, gold keylines, pale blue-grey panels.
    primary: "#0E3A5D"        # navy — header, tool rail, primary chrome
    primaryDark: "#08283F"
    primaryMid: "#2F6183"     # the slate blue of the Conservation Data Lifecycle ring
    accent: "#E9B94B"         # gold — keylines, active states, fills
    accentDark: "#C9971F"
    accentInk: "#8A6410"      # gold dark enough to be TEXT on a light surface
    accentBorder: "#8A6410"   # active control outlines — gold fails 3:1 as a border
    surface: "#FFFFFF"
    surfaceAlt: "#EDF1F6"     # pale blue-grey panel
    panel: "#DCE3EC"
    border: "#C9D4E0"         # decorative separators only
    borderStrong: "#6E8598"   # anything that OUTLINES A CONTROL — WCAG 1.4.11
    text: "#14202B"
    textMuted: "#55636F"
    danger: "#B3261E"
    dangerInk: "#FFFFFF"      # text that sits on a danger fill
    focusRing: "#8A6410"
    focusRingInverse: "#F2CE79"   # focus on navy chrome, where the dark ring vanishes
  # Dark palette. Declared here rather than in the stylesheet so the contrast
  # checker can audit both themes from one source — see npm run a11y:contrast.
  themeDark:
    primary: "#12283C"
    primaryDark: "#0B1B29"
    primaryMid: "#4E86AC"
    accent: "#E9B94B"
    accentDark: "#F0CB77"
    accentInk: "#F2CE79"      # on a dark ground the light gold IS the text colour
    accentBorder: "#E9B94B"
    surface: "#101C26"
    surfaceAlt: "#16242F"
    panel: "#1B2C39"
    border: "#3A4C5B"
    borderStrong: "#6B8296"
    text: "#E9EFF4"
    textMuted: "#A8B8C6"
    danger: "#F2887E"
    dangerInk: "#2A0D0A"      # the dark-mode danger is a light red; white on it fails
    focusRing: "#F2CE79"
    focusRingInverse: "#F2CE79"

  layout:
    filterBarHeight: 68
    resultsRailWidth: 400
    sidebarWidth: 380
    mobileBreakpoint: 768
    tabletBreakpoint: 1024
  # NEW: none of this existed in the legacy app.
  darkMode: auto            # auto | light | dark
  reduceMotionRespected: true
  a11y:
    announceResultCounts: true
    keyboardShortcuts: true
  shortcuts:
    help: "?"
    search: "/"
    toggleLayers: "l"
    toggleFilters: "f"
    clearHighlight: "Escape"
    print: "p"

# =============================================================================
#  TELEMETRY / DIAGNOSTICS
# =============================================================================
diagnostics:
  # Surfaces a "Service health" panel listing every configured endpoint and
  # whether it responded. This is the thing that would have caught the GeoMAC
  # decommission in 2020 instead of in 2025.
  healthPanel: true
  probeOnBoot: false        # true = probe every service at page load
  logLevel: warn            # debug | info | warn | error
  showLayerLoadErrors: true
