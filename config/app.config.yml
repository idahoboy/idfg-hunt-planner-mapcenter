    url: ${roots.blm}/lands/BLM_Natl_SMA_Cached_without_PriUnk/MapServer
    health: replaced
    opacity: 0.7
    disclaimer:
      text: >
        IMPORTANT: Obtain landowner permission before entering or crossing private
        lands. Ownership shown is generalized and is not a legal boundary survey.
      url: https://www.blm.gov/services/geospatial

  - id: access-yes
    title: Access Yes! Properties
    group: reference
    legacyBit: 256
    type: feature
    url: ${roots.idfgRest}/Hosted/Access_Yes_2026_public/FeatureServer/0
    definitionExpression: "bidid IS NOT NULL"
    health: verified
    outFields: ["*"]
    popup:
      title: "Access Yes! — {name}"
      fields:
        - { label: General area, field: generalarea }
        - { label: Description, field: description }
        - { label: Directions, field: directions }
        - { label: Public acres, field: accesspublicacres, format: number }
        - { label: Access opens, field: accessbegin, format: date }
        - { label: Access closes, field: accessend, format: date }
        - { label: Contact, field: contactname }
      badges:
        - { label: Big game, field: biggame }
        - { label: Upland game, field: uplandgame }
        - { label: Waterfowl, field: waterfowl }
        - { label: Trapping, field: trapping }
